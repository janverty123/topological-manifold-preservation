experiment:
  id: EXP-001
  name: split_mnist_2task_baseline
  parent_config: configs/baseline/split_mnist_2task.yaml
  version: 1
  status: validated
  created: 2026-07-27
  author: Mike Sales (research team), implementation by Claude

objective: >
  Establish the original, simplest possible test of the TMP algorithm:
  2-task Split-MNIST (digits 0-4, then 5-9), comparing Finetune vs. EWC
  vs. TMP on retention accuracy, learning accuracy, and computational
  overhead, per the approved research plan's Methodology section.

methods_run:
  - finetune
  - ewc
  - tmp

key_hyperparameters:
  tmp_lambda: 5.0     # validated via sweep_tmp_lambda.py; see EXPERIMENT_LOG.md EXP-001-05
  ewc_lambda: 20000.0  # retuned up from an initial 400.0 -- see EXPERIMENT_LOG.md EXP-001-03
  num_tasks: 2

related:
  experiment_log_entry: EXPERIMENT_LOG.md#EXP-001
  open_questions: OPEN_QUESTIONS.md

result_summary: >
  Lambda sweep (sweep_tmp_lambda.py) validated tmp.lambda_=5.0 as the
  best setting: final retention accuracy 96.28% (vs. EWC 68.87% at
  ewc.lambda_=20000, vs. Finetune 24.15% unprotected), with strong
  learning_acc (98.8%) maintained throughout. lambda_=0.0 ablation
  confirmed retention collapses to ~24% (matching Finetune), proving
  the regularizer itself (not incidental code structure) drives the
  improvement. This result is considered validated and stable.
